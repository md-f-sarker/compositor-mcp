name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm publish --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - name: Build the release tarball
        run: npm pack -w compositor-mcp --pack-destination /tmp
      - name: Smoke-test the tarball
        run: |
          mkdir -p /tmp/pack-smoke && cd /tmp/pack-smoke
          npm init -y >/dev/null
          npm install /tmp/compositor-mcp-*.tgz
          ./node_modules/.bin/compositor-mcp --help
      - name: Publish to npm
        run: npm publish -w compositor-mcp --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
