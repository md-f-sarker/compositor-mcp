name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm publish --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - name: Verify the tag matches the package version
        run: |
          PKG_VERSION="$(node -p "require('./packages/mcp-server/package.json').version")"
          test "v${PKG_VERSION}" = "${GITHUB_REF_NAME}"
      - name: Smoke-test the packed tarball
        run: npm run pack:smoke
      - name: Publish to npm
        run: npm publish -w compositor-mcp-server --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
