name: Release preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Full-history secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Include pull-request history
        run: git fetch origin '+refs/pull/*/head:refs/remotes/pull/*/head'
      - name: Install Gitleaks and scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
      - name: Explicitly scan every fetched ref
        run: gitleaks git --redact --no-banner --log-opts='--all' .
