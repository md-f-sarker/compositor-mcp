name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build

  installer-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create representative upstream tree
        run: |
          mkdir -p /tmp/Compositor/Compositor.xcodeproj /tmp/Compositor/Compositor/IO
          cat > /tmp/Compositor/Compositor/IO/CompositorApplicationDelegate.swift <<'SWIFT'
          import AppKit
          import Sparkle

          final class CompositorApplicationDelegate: NSObject, NSApplicationDelegate {
              let workspace = ProjectWorkspace()
              var session: EditorSession { workspace.current.session }
              var projects: ProjectController { workspace.current.controller }
              var showEditor: (() -> Void)?
              let updater = SPUStandardUpdaterController(startingUpdater: false, updaterDelegate: nil, userDriverDelegate: nil)

              func applicationDidFinishLaunching(_ notification: Notification) {
                  DispatchQueue.main.asyncAfter(deadline: .now() + 1) { [updater] in updater.startUpdater() }
              }

              func applicationShouldHandleReopen(_ sender: NSApplication, hasVisibleWindows flag: Bool) -> Bool {
                  if !flag { showEditor?() }
                  return true
              }
          }
          SWIFT
      - run: ./scripts/install-into-compositor.sh /tmp/Compositor
      - run: ./scripts/install-into-compositor.sh /tmp/Compositor
      - run: test -f /tmp/Compositor/Compositor/MCP/CompositorMCPBridge.swift
      - run: grep -q 'bridge.start()' /tmp/Compositor/Compositor/IO/CompositorApplicationDelegate.swift
      - run: ./scripts/uninstall-from-compositor.sh /tmp/Compositor
