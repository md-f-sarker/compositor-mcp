name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build

  installer-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create representative upstream tree
        run: |
          mkdir -p /tmp/Compositor/Compositor.xcodeproj /tmp/Compositor/Compositor/IO
          cp packages/mcp-server/test/fixtures/AppDelegate.fixture.swift /tmp/Compositor/Compositor/IO/CompositorApplicationDelegate.swift
          printf '\t\tCODE_SIGN_ENTITLEMENTS = Config/Compositor.entitlements;\n\t\tENABLE_APP_SANDBOX = YES;\n' > /tmp/Compositor/Compositor.xcodeproj/project.pbxproj
      - run: ./scripts/install-into-compositor.sh /tmp/Compositor
      - run: ./scripts/install-into-compositor.sh /tmp/Compositor
      - run: test -f /tmp/Compositor/Compositor/MCP/CompositorMCPBridge.swift
      - run: grep -q 'bridge.start()' /tmp/Compositor/Compositor/IO/CompositorApplicationDelegate.swift
      - run: grep -q 'ENABLE_APP_SANDBOX = NO;' /tmp/Compositor/Compositor.xcodeproj/project.pbxproj
      - run: ./scripts/uninstall-from-compositor.sh /tmp/Compositor
      - run: grep -q 'ENABLE_APP_SANDBOX = YES;' /tmp/Compositor/Compositor.xcodeproj/project.pbxproj

  pack-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run pack:smoke
